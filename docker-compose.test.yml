# Docker Compose Test Configuration
# Use with: docker compose -f docker-compose.test.yml up --abort-on-container-exit
# This configuration is optimized for automated testing in CI/CD pipelines

version: '3.8'

services:
  # Test Database
  postgres-test:
    image: postgres:15-alpine
    container_name: mking-postgres-test
    environment:
      POSTGRES_DB: mking_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5433:5432'  # Different port to avoid conflicts
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/test-seeds:/docker-entrypoint-initdb.d/seeds:ro
    networks:
      - test-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mking_test']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    tmpfs:
      - /var/lib/postgresql/data  # Use tmpfs for faster tests

  # Test Redis
  redis-test:
    image: redis:7-alpine
    container_name: mking-redis-test
    command: redis-server --appendonly no --save ""  # Disable persistence for tests
    ports:
      - '6380:6379'  # Different port to avoid conflicts
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    tmpfs:
      - /data  # Use tmpfs for faster tests

  # Test MinIO
  minio-test:
    image: minio/minio:latest
    container_name: mking-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    ports:
      - '9002:9000'
      - '9003:9001'
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 3
    tmpfs:
      - /data  # Use tmpfs for faster tests

  # Test Typesense
  typesense-test:
    image: typesense/typesense:0.25.2
    container_name: mking-typesense-test
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: test-api-key
      TYPESENSE_ENABLE_CORS: true
    ports:
      - '8109:8108'
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8108/health']
      interval: 10s
      timeout: 5s
      retries: 3
    tmpfs:
      - /data  # Use tmpfs for faster tests

  # Backend Tests
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    container_name: mking-backend-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - REDIS_URL=redis://redis-test:6379
      - MINIO_ENDPOINT=minio-test:9000
      - MINIO_ACCESS_KEY=testuser
      - MINIO_SECRET_KEY=testpassword
      - TYPESENSE_HOST=typesense-test
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=test-api-key
      - JWT_SECRET=test-jwt-secret
      - ENCRYPTION_KEY=test-encryption-key
      - CI=true
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      typesense-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Waiting for services to be ready...'
        sleep 5
        echo 'Running database migrations...'
        npm run db:migrate:test
        echo 'Seeding test data...'
        npm run db:seed:test
        echo 'Running unit tests...'
        npm run test:unit
        echo 'Running integration tests...'
        npm run test:integration
        echo 'Running API tests...'
        npm run test:api
        echo 'Generating coverage report...'
        npm run test:coverage
      "

  # Frontend Tests
  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    container_name: mking-frontend-test
    environment:
      - NODE_ENV=test
      - VITE_API_BASE_URL=http://backend-test:8000/api
      - CI=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./test-results:/app/test-results
      - ./coverage:/app/coverage
    networks:
      - test-network
    depends_on:
      - backend-test
    command: >
      sh -c "
        echo 'Running frontend unit tests...'
        npm run test:unit
        echo 'Running component tests...'
        npm run test:component
        echo 'Running E2E tests...'
        npm run test:e2e
        echo 'Generating coverage report...'
        npm run test:coverage
      "

  # Auth Service Tests
  auth-service-test:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
      target: test
    container_name: mking-auth-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - REDIS_URL=redis://redis-test:6379
      - JWT_SECRET=test-jwt-secret
      - JWT_REFRESH_SECRET=test-refresh-secret
      - CI=true
    volumes:
      - ./services/auth:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running auth service tests...'
        npm run test:unit
        npm run test:integration
      "

  # User Service Tests
  user-service-test:
    build:
      context: ./services/user
      dockerfile: Dockerfile
      target: test
    container_name: mking-user-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - REDIS_URL=redis://redis-test:6379
      - TYPESENSE_HOST=typesense-test
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=test-api-key
      - CI=true
    volumes:
      - ./services/user:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      typesense-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running user service tests...'
        npm run test:unit
        npm run test:integration
      "

  # Chat Service Tests
  chat-service-test:
    build:
      context: ./services/chat
      dockerfile: Dockerfile
      target: test
    container_name: mking-chat-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - REDIS_URL=redis://redis-test:6379
      - TYPESENSE_HOST=typesense-test
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=test-api-key
      - CI=true
    volumes:
      - ./services/chat:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      typesense-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running chat service tests...'
        npm run test:unit
        npm run test:integration
        npm run test:websocket
      "

  # Media Service Tests
  media-service-test:
    build:
      context: ./services/media
      dockerfile: Dockerfile
      target: test
    container_name: mking-media-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - MINIO_ENDPOINT=minio-test:9000
      - MINIO_ACCESS_KEY=testuser
      - MINIO_SECRET_KEY=testpassword
      - MINIO_BUCKET=test-bucket
      - CI=true
    volumes:
      - ./services/media:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running media service tests...'
        npm run test:unit
        npm run test:integration
        npm run test:upload
      "

  # Admin Service Tests
  admin-service-test:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
      target: test
    container_name: mking-admin-test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/mking_test
      - REDIS_URL=redis://redis-test:6379
      - ADMIN_JWT_SECRET=test-admin-jwt-secret
      - CI=true
    volumes:
      - ./services/admin:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: >
      sh -c "
        echo 'Running admin service tests...'
        npm run test:unit
        npm run test:integration
      "

  # Integration Tests
  integration-test:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: mking-integration-test
    environment:
      - NODE_ENV=test
      - API_BASE_URL=http://backend-test:8000
      - FRONTEND_URL=http://frontend-test:3000
      - CI=true
    volumes:
      - ./tests:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    depends_on:
      - backend-test
      - frontend-test
      - auth-service-test
      - user-service-test
      - chat-service-test
      - media-service-test
      - admin-service-test
    command: >
      sh -c "
        echo 'Waiting for all services to be ready...'
        sleep 30
        echo 'Running end-to-end integration tests...'
        npm run test:e2e
        echo 'Running API integration tests...'
        npm run test:api:integration
        echo 'Running performance tests...'
        npm run test:performance
      "

  # Test Results Collector
  test-results:
    image: alpine:latest
    container_name: mking-test-results
    volumes:
      - ./test-results:/results
      - ./coverage:/coverage
    networks:
      - test-network
    depends_on:
      - backend-test
      - frontend-test
      - auth-service-test
      - user-service-test
      - chat-service-test
      - media-service-test
      - admin-service-test
      - integration-test
    command: >
      sh -c "
        echo 'Collecting test results...'
        find /results -name '*.xml' -o -name '*.json' | head -20
        echo 'Collecting coverage reports...'
        find /coverage -name '*.lcov' -o -name '*.json' | head -20
        echo 'Test execution completed!'
      "

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# No persistent volumes for test environment - everything runs in memory/tmpfs