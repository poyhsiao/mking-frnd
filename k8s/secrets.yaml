# WARNING: This file contains secret templates and should NOT contain actual secrets
# Secrets should be injected via external secret management systems or CI/CD pipelines
# For development, use kubectl to create secrets manually or use tools like sealed-secrets

# SECURITY NOTICE:
# - This file serves as a template only
# - Never commit actual secret values to version control
# - Use external secret management (e.g., Sealed Secrets, External Secrets Operator)
# - All secret values should be base64 encoded when applied
# - Consider using SealedSecrets for GitOps workflows

---
# Example: How to create secrets securely
# kubectl create secret generic mking-friend-secrets \
#   --from-literal=POSTGRES_PASSWORD="your-secure-password" \
#   --from-literal=JWT_SECRET="your-jwt-secret" \
#   --namespace=mking-friend \
#   --dry-run=client -o yaml | kubeseal -o yaml > sealed-secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: mking-friend-secrets
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    # Security annotations
    security.kubernetes.io/managed-by: "external-secret-manager"
    security.kubernetes.io/rotation-policy: "30d"
    security.kubernetes.io/classification: "restricted"
type: Opaque
data:
  # Database Secrets - MUST be injected via external secret manager
  # Example: echo -n "your-password" | base64
  POSTGRES_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  AUTH_DB_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  USER_DB_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  CHAT_DB_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  MEDIA_DB_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  ADMIN_DB_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  DATABASE_URL: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # JWT Secrets - MUST be cryptographically secure random strings
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  JWT_REFRESH_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Redis Password - MUST be injected via external secret manager
  REDIS_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # AWS Credentials - MUST be injected via external secret manager
  # Use IAM roles with IRSA (IAM Roles for Service Accounts) when possible
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # MinIO Credentials - MUST be injected via external secret manager
  MINIO_ACCESS_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  MINIO_SECRET_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Typesense API Key - MUST be injected via external secret manager
  TYPESENSE_API_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # OAuth Secrets - MUST be injected via external secret manager
  # Obtain from respective OAuth providers
  GOOGLE_CLIENT_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  GITHUB_CLIENT_ID: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  GITHUB_CLIENT_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Email Service - MUST be injected via external secret manager
  SMTP_HOST: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  SMTP_PORT: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  SMTP_USER: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  SMTP_PASSWORD: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Sentry DSN - MUST be injected via external secret manager
  SENTRY_DSN: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Encryption Keys - MUST be cryptographically secure
  # Generate with: openssl rand -base64 32
  ENCRYPTION_KEY: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret
  
  # Session Secret - MUST be cryptographically secure
  # Generate with: openssl rand -base64 32
  SESSION_SECRET: "REPLACE_WITH_BASE64_ENCODED_VALUE"  # pragma: allowlist secret

---
apiVersion: v1
kind: Secret
metadata:
  name: mking-friend-tls
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-tls
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    # Security annotations
    security.kubernetes.io/managed-by: "cert-manager"
    security.kubernetes.io/rotation-policy: "90d"
    security.kubernetes.io/classification: "restricted"
type: kubernetes.io/tls
data:
  # TLS Certificate and Key - MUST be injected via cert-manager or external secret manager
  # Use cert-manager for automatic certificate management
  tls.crt: "REPLACE_WITH_BASE64_ENCODED_CERTIFICATE"  # pragma: allowlist secret
  tls.key: "REPLACE_WITH_BASE64_ENCODED_PRIVATE_KEY"  # pragma: allowlist secret