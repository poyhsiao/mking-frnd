# External Secrets Operator Configuration
# This file sets up External Secrets Operator for secure secret management
# Prerequisites:
# 1. Install External Secrets Operator:
#    helm repo add external-secrets https://charts.external-secrets.io
#    helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
# 2. Configure your secret backend (Vault, AWS Secrets Manager, etc.)

---
# SecretStore for HashiCorp Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: vault-backend
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"
    security.kubernetes.io/classification: "restricted"
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mking-friend-role"
          serviceAccountRef:
            name: "external-secrets-sa"

---
# SecretStore for AWS Secrets Manager
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: aws-secrets-manager
    app.kubernetes.io/component: secret-store
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"
    security.kubernetes.io/classification: "restricted"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-west-2
      auth:
        secretRef:
          accessKeyID:
            name: aws-credentials
            key: access-key-id
          secretAccessKey:
            name: aws-credentials
            key: secret-access-key

---
# ExternalSecret for application secrets from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mking-friend-secrets
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-secrets
    app.kubernetes.io/component: external-secret
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"
    security.kubernetes.io/rotation-policy: "30d"
    security.kubernetes.io/classification: "restricted"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: mking-friend-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: mking-friend-secrets
          app.kubernetes.io/component: secrets
          app.kubernetes.io/part-of: mking-friend-platform
        annotations:
          security.kubernetes.io/managed-by: "external-secrets-operator"
          security.kubernetes.io/rotation-policy: "30d"
          security.kubernetes.io/classification: "restricted"
  data:
    # Database secrets
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: postgres_password
    - secretKey: AUTH_DB_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: auth_db_password
    - secretKey: USER_DB_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: user_db_password
    - secretKey: CHAT_DB_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: chat_db_password
    - secretKey: MEDIA_DB_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: media_db_password
    - secretKey: ADMIN_DB_PASSWORD
      remoteRef:
        key: mking-friend/database
        property: admin_db_password
    - secretKey: DATABASE_URL
      remoteRef:
        key: mking-friend/database
        property: database_url

    # JWT secrets
    - secretKey: JWT_SECRET
      remoteRef:
        key: mking-friend/auth
        property: jwt_secret
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: mking-friend/auth
        property: jwt_refresh_secret

    # Redis password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: mking-friend/cache
        property: redis_password

    # AWS credentials
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: mking-friend/aws
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: mking-friend/aws
        property: secret_access_key

    # MinIO credentials
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: mking-friend/minio
        property: access_key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: mking-friend/minio
        property: secret_key

    # Typesense API key
    - secretKey: TYPESENSE_API_KEY
      remoteRef:
        key: mking-friend/search
        property: api_key

    # OAuth secrets
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: mking-friend/oauth
        property: google_client_id
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: mking-friend/oauth
        property: google_client_secret
    - secretKey: GITHUB_CLIENT_ID
      remoteRef:
        key: mking-friend/oauth
        property: github_client_id
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        key: mking-friend/oauth
        property: github_client_secret

    # Email service
    - secretKey: SMTP_HOST
      remoteRef:
        key: mking-friend/email
        property: smtp_host
    - secretKey: SMTP_PORT
      remoteRef:
        key: mking-friend/email
        property: smtp_port
    - secretKey: SMTP_USER
      remoteRef:
        key: mking-friend/email
        property: smtp_user
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: mking-friend/email
        property: smtp_password

    # Sentry DSN
    - secretKey: SENTRY_DSN
      remoteRef:
        key: mking-friend/monitoring
        property: sentry_dsn

    # Encryption keys
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: mking-friend/encryption
        property: encryption_key

    # Session secret
    - secretKey: SESSION_SECRET
      remoteRef:
        key: mking-friend/session
        property: session_secret

---
# Service Account for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: external-secrets-sa
    app.kubernetes.io/component: service-account
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"

---
# ClusterRole for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-mking-friend
  labels:
    app.kubernetes.io/name: external-secrets-mking-friend
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"
    security.kubernetes.io/classification: "restricted"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for External Secrets Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-mking-friend
  labels:
    app.kubernetes.io/name: external-secrets-mking-friend
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "external-secrets-operator"
    security.kubernetes.io/classification: "restricted"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-mking-friend
subjects:
  - kind: ServiceAccount
    name: external-secrets-sa
    namespace: mking-friend
