# SEALED SECRETS EXAMPLE
# This file demonstrates how to use Sealed Secrets for secure secret management
# Sealed Secrets encrypt your secrets so they can be safely stored in Git

# PREREQUISITES:
# 1. Install Sealed Secrets controller in your cluster:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
# 2. Install kubeseal CLI tool:
#    brew install kubeseal (macOS) or download from GitHub releases

# HOW TO CREATE SEALED SECRETS:
# 1. Create a regular Kubernetes secret (don't apply it):
#    kubectl create secret generic mking-friend-secrets \
#      --from-literal=POSTGRES_PASSWORD="your-secure-password" \
#      --from-literal=JWT_SECRET="$(openssl rand -base64 32)" \
#      --from-literal=REDIS_PASSWORD="your-redis-password" \
#      --namespace=mking-friend \
#      --dry-run=client -o yaml > temp-secret.yaml
#
# 2. Seal the secret:
#    kubeseal -f temp-secret.yaml -w sealed-secret.yaml
#
# 3. Delete the temporary file:
#    rm temp-secret.yaml
#
# 4. Apply the sealed secret:
#    kubectl apply -f sealed-secret.yaml

---
# Example SealedSecret for application secrets
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mking-friend-secrets
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    # Security annotations
    security.kubernetes.io/managed-by: "sealed-secrets"
    security.kubernetes.io/rotation-policy: "30d"
    security.kubernetes.io/classification: "restricted"
spec:
  # These are example encrypted values - replace with your actual sealed values
  encryptedData:
    # Database secrets
    POSTGRES_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    AUTH_DB_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    USER_DB_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    CHAT_DB_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    MEDIA_DB_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    ADMIN_DB_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    DATABASE_URL: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # JWT secrets
    JWT_SECRET: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    JWT_REFRESH_SECRET: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Redis password
    REDIS_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # AWS credentials
    AWS_ACCESS_KEY_ID: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    AWS_SECRET_ACCESS_KEY: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # MinIO credentials
    MINIO_ACCESS_KEY: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    MINIO_SECRET_KEY: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Typesense API key
    TYPESENSE_API_KEY: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # OAuth secrets
    GOOGLE_CLIENT_ID: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    GOOGLE_CLIENT_SECRET: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    GITHUB_CLIENT_ID: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    GITHUB_CLIENT_SECRET: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Email service
    SMTP_HOST: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    SMTP_PORT: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    SMTP_USER: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    SMTP_PASSWORD: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Sentry DSN
    SENTRY_DSN: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Encryption keys
    ENCRYPTION_KEY: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
    
    # Session secret
    SESSION_SECRET: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_VALUE"
  template:
    type: Opaque
    metadata:
      labels:
        app.kubernetes.io/name: mking-friend-secrets
        app.kubernetes.io/component: secrets
        app.kubernetes.io/part-of: mking-friend-platform
      annotations:
        security.kubernetes.io/managed-by: "sealed-secrets"
        security.kubernetes.io/rotation-policy: "30d"
        security.kubernetes.io/classification: "restricted"

---
# Example SealedSecret for TLS certificates
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: mking-friend-tls
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-tls
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: mking-friend-platform
  annotations:
    security.kubernetes.io/managed-by: "sealed-secrets"
    security.kubernetes.io/rotation-policy: "90d"
    security.kubernetes.io/classification: "restricted"
spec:
  # These are example encrypted values - replace with your actual sealed values
  encryptedData:
    tls.crt: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_CERTIFICATE"
    tls.key: "AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq...EXAMPLE_ENCRYPTED_PRIVATE_KEY"
  template:
    type: kubernetes.io/tls
    metadata:
      labels:
        app.kubernetes.io/name: mking-friend-tls
        app.kubernetes.io/component: tls
        app.kubernetes.io/part-of: mking-friend-platform
      annotations:
        security.kubernetes.io/managed-by: "sealed-secrets"
        security.kubernetes.io/rotation-policy: "90d"
        security.kubernetes.io/classification: "restricted"

---
# SECURITY BEST PRACTICES:
#
# 1. Key Rotation:
#    - Sealed Secrets controller automatically rotates encryption keys
#    - Re-seal secrets periodically for enhanced security
#
# 2. Namespace Scoping:
#    - SealedSecrets are namespace-scoped by default
#    - Use cluster-wide scope only when necessary
#
# 3. Backup Strategy:
#    - Backup the controller's private key for disaster recovery
#    - Store backups securely and separately from the cluster
#
# 4. Access Control:
#    - Limit who can create/modify SealedSecrets
#    - Use RBAC to control access to the sealed-secrets namespace
#
# 5. Monitoring:
#    - Monitor for failed unsealing operations
#    - Set up alerts for controller health
#
# 6. Secret Rotation:
#    - Implement regular secret rotation policies
#    - Use external secret management for automatic rotation