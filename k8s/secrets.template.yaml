# Kubernetes Secrets Template
# This file serves as a template for creating secrets in different environments
# DO NOT put actual secret values in this file

# For development environment, copy this file and replace placeholders with actual values
# Then create secrets using: kubectl apply -f your-secrets-file.yaml
# Remember to add your actual secrets file to .gitignore

apiVersion: v1
kind: Secret
metadata:
  name: mking-friend-secrets
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-secrets
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: mking-friend-platform
type: Opaque
stringData:  # Using stringData for easier template editing
  # Database Secrets
  POSTGRES_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  AUTH_DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  USER_DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  CHAT_DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  MEDIA_DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  ADMIN_DB_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  DATABASE_URL: "postgresql://postgres:REPLACE_WITH_ACTUAL_PASSWORD@postgres-service:5432/mking_friend"
  
  # JWT Secrets
  JWT_SECRET: "REPLACE_WITH_ACTUAL_JWT_SECRET"
  JWT_REFRESH_SECRET: "REPLACE_WITH_ACTUAL_REFRESH_SECRET"
  
  # Redis Password
  REDIS_PASSWORD: "REPLACE_WITH_ACTUAL_REDIS_PASSWORD"
  
  # AWS Credentials
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_ACTUAL_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_ACTUAL_SECRET_KEY"
  
  # MinIO Credentials
  MINIO_ACCESS_KEY: "REPLACE_WITH_ACTUAL_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "REPLACE_WITH_ACTUAL_MINIO_SECRET_KEY"
  
  # Typesense API Key
  TYPESENSE_API_KEY: "REPLACE_WITH_ACTUAL_TYPESENSE_KEY"
  
  # OAuth Secrets
  GOOGLE_CLIENT_ID: "REPLACE_WITH_ACTUAL_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_GOOGLE_CLIENT_SECRET"
  GITHUB_CLIENT_ID: "REPLACE_WITH_ACTUAL_GITHUB_CLIENT_ID"
  GITHUB_CLIENT_SECRET: "REPLACE_WITH_ACTUAL_GITHUB_CLIENT_SECRET"
  
  # Email Service
  SMTP_HOST: "smtp.gmail.com"  # or your SMTP provider
  SMTP_PORT: "587"
  SMTP_USER: "REPLACE_WITH_ACTUAL_EMAIL"
  SMTP_PASSWORD: "REPLACE_WITH_ACTUAL_EMAIL_PASSWORD"
  
  # Sentry DSN
  SENTRY_DSN: "REPLACE_WITH_ACTUAL_SENTRY_DSN"
  
  # Encryption Keys
  ENCRYPTION_KEY: "REPLACE_WITH_ACTUAL_ENCRYPTION_KEY"
  
  # Session Secret
  SESSION_SECRET: "REPLACE_WITH_ACTUAL_SESSION_SECRET"

---
apiVersion: v1
kind: Secret
metadata:
  name: mking-friend-tls
  namespace: mking-friend
  labels:
    app.kubernetes.io/name: mking-friend-tls
    app.kubernetes.io/component: tls
    app.kubernetes.io/part-of: mking-friend-platform
type: kubernetes.io/tls
data:
  # TLS certificate and key will be managed by cert-manager
  # These are placeholders - actual certificates will be generated automatically
  tls.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t
  tls.key: LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t