name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8.15.1'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-type: [unit, integration, e2e]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Create test results directory
        run: |
          mkdir -p test-results coverage
          chmod 777 test-results coverage
      
      - name: Run ${{ matrix.test-type }} tests with Docker Compose
        run: |
          echo "Running ${{ matrix.test-type }} tests..."
          
          # Set test environment variables
          export TEST_TYPE=${{ matrix.test-type }}
          export CI=true
          
          # Run tests based on type
          case "${{ matrix.test-type }}" in
            "unit")
              echo "Running unit tests for all services..."
              docker compose -f docker-compose.test.yml up --build --abort-on-container-exit \
                backend-test auth-service-test user-service-test chat-service-test media-service-test admin-service-test
              ;;
            "integration")
              echo "Running integration tests..."
              docker compose -f docker-compose.test.yml up --build --abort-on-container-exit \
                postgres-test redis-test minio-test typesense-test integration-test
              ;;
            "e2e")
              echo "Running end-to-end tests..."
              docker compose -f docker-compose.test.yml up --build --abort-on-container-exit \
                postgres-test redis-test minio-test typesense-test frontend-test backend-test integration-test
              ;;
          esac
      
      - name: Collect test results
        if: always()
        run: |
          echo "Collecting test results for ${{ matrix.test-type }}..."
          docker compose -f docker-compose.test.yml up --no-deps test-results
          
          # Copy results from containers if they exist
          docker compose -f docker-compose.test.yml logs backend-test > test-results/backend-${{ matrix.test-type }}.log 2>&1 || true
          docker compose -f docker-compose.test.yml logs frontend-test > test-results/frontend-${{ matrix.test-type }}.log 2>&1 || true
          docker compose -f docker-compose.test.yml logs integration-test > test-results/integration-${{ matrix.test-type }}.log 2>&1 || true
      
      - name: Cleanup test environment
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v --remove-orphans
          docker system prune -f
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: |
            test-results/
            coverage/
          retention-days: 30
  
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Validate lockfile and install dependencies
        run: |
          echo "🔍 Checking lockfile synchronization..."
          
          # Check pnpm version
          echo "📦 PNPM version: $(pnpm --version)"
          
          # Validate lockfile with detailed error reporting
          if ! pnpm install --frozen-lockfile; then
            echo "❌ Lockfile validation failed"
            echo "📋 Diagnostic information:"
            echo "   - PNPM version: $(pnpm --version)"
            echo "   - Node version: $(node --version)"
            echo "   - OS: ${{ runner.os }}"
            
            # Check for common issues
            if [ ! -f "pnpm-lock.yaml" ]; then
              echo "💡 Issue: pnpm-lock.yaml file is missing"
              echo "🔧 Solution: Run 'pnpm install' to generate the lockfile"
            else
              echo "💡 Issue: Lockfile is out of sync with package.json files"
              echo "🔧 Solution: Run 'pnpm install' locally and commit the updated pnpm-lock.yaml"
            fi
            
            echo "📝 Steps to fix:"
            echo "   1. Run 'pnpm install' in your local environment"
            echo "   2. Commit the updated pnpm-lock.yaml file"
            echo "   3. Push the changes to trigger a new build"
            
            exit 1
          fi
          
          echo "✅ Lockfile is properly synchronized"
      
      - name: Lint backend
        run: pnpm run lint
        working-directory: ./backend
      
      - name: Lint frontend
        run: pnpm run lint
        working-directory: ./frontend
      
      - name: Type check backend
        run: pnpm run build
        working-directory: ./backend
      
      - name: Type check frontend
        run: pnpm run build
        working-directory: ./frontend
  
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          merge-multiple: true
          path: ./test-results
      
      - name: Merge coverage reports
        run: |
          echo "Merging coverage reports..."
          mkdir -p merged-coverage

          # Install lcov if not present
          if ! command -v lcov &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y lcov
          fi

          # Merge all .lcov files properly
          lcov_files=$(find ./test-results -name "*.lcov")
          if [ -n "$lcov_files" ]; then
            first=1
            for file in $lcov_files; do
              if [ $first -eq 1 ]; then
                cp "$file" merged-coverage/lcov.info
                first=0
              else
                lcov --add-tracefile merged-coverage/lcov.info --add-tracefile "$file" --output-file merged-coverage/lcov.info
              fi
            done
          fi

          find ./test-results -name "coverage-final.json" -exec cp {} merged-coverage/ \; || true
      
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./merged-coverage/lcov.info
          fail_ci_if_error: false
          handle_no_reports_found: true
          verbose: true
          flags: unittests
          name: codecov-umbrella
          env_vars: OS,NODE_VERSION
          directory: ./merged-coverage
          disable_search: false

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # For example, using kubectl, helm, or other deployment tools

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # For example, using kubectl, helm, or other deployment tools